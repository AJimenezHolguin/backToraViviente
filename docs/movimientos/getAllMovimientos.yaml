paths:
  /api/movimientos:
    get:
      summary: Obtener todas los movimientos
      description: Devuelve una lista de todos los movimientos contables disponibles.
      tags:
        - Movimientos
      security:
        - bearerAuth: []  # Require authentication
      parameters:
        - in: query
          name: page
          required: true
          schema:
            type: string
          description: Número de página para la paginación
        - in: query
          name: take
          required: true
          schema:
            type: string
          description: Número de elementos por página
        - in: query
          name: order
          required: true
          schema:
            type: string
            enum: 
              - ASC
              - DESC
          description: Orden de los resultados (Ascendente o Descendente)
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Término de búsqueda opcional
      responses:
        '200':
          description: Lista de movimientos(asientos) contables.
          components:
  schemas:

    Movimiento:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a9da68d5-b58e-45be-b538-4346c83285b4"
        numero_registro:
          type: integer
          example: 1
        fecha:
          type: string
          format: date
          example: "2026-02-28"
        descripcion:
          type: string
          example: "ofrenda morim"
        tipo:
          type: string
          enum: [ingreso, gasto]
          example: "ingreso"
        ingreso:
          type: number
          example: 50000
        gasto:
          type: number
          example: 0
        saldo:
          type: number
          example: 50000
        estado:
          type: string
          enum: [activo, anulado]
          example: "activo"
        referencia_id:
          type: string
          format: uuid
          nullable: true
          example: null
        usuario_uuid:
          type: string
          example: "6895042e08eb24f04cfd2194"
        usuario_nombre:
          type: string
          example: "Anderson-Desarrollo"
        usuario_correo:
          type: string
          format: email
          example: "desarrollo@toraviviente.com"
        created_at:
          type: string
          format: date-time
          example: "2026-03-02T21:42:20.12043+00:00"

    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
          example: 1
        take:
          type: integer
          example: 10
        total:
          type: integer
          example: 2
        pageCount:
          type: integer
          example: 1
        hasPreviousPage:
          type: boolean
          example: false
        hasNextPage:
          type: boolean
          example: false
        order:
          type: string
          example: "DESC"
        sortBy:
          type: string
          example: "numero_registro"
        search:
          type: string
          example: ""
        '401':
          description: No autorizado - Token inválido o faltante
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No autorizado - Token inválido o faltante"
        
        '500':
          description: Error al obtener movimientos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error al obtener movimientos"
                  error:
                    type: string
                    example: "Detalles del error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT